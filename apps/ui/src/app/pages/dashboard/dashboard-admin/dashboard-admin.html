<div class="d-flex flex-row gap-3 pb-4">

  <div class="card p-2" style="width: 18rem;">
    <div class="card-body d-flex flex-column align-items-center">
      <h5 class="card-title">Demande de reservation</h5>
      <app-stat-card
        [title]="'Reservations clients'"
        [totalBooking]="6"
        [cardStyle]="DashboardCardStyle.DANGER"
      (onClick)="redirectToReservationWaitingForCompany()"/>
    </div>
  </div>

  <div class="card flex-grow-1">
    <div class="card-body d-flex flex-column align-items-center">
      <h5 class="card-title">En attente de paiement</h5>

      <div class="d-flex justify-content-center gap-3 mt-2">
        <app-stat-card
          [title]="'Prestations passées'"
          [totalBooking]="0"
          [cardStyle]="DashboardCardStyle.SUCCESS"/>
        <app-stat-card
          [title]="'Prestations à venir'"
          [totalBooking]="2"
          [cardStyle]="DashboardCardStyle.WARNING"/>
      </div>
    </div>
  </div>
</div>

<app-daily-schedule/>
